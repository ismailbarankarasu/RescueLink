services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rescuelink-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "14330:1433"
    volumes:
      - rescuelink-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    image: rescuelink-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rescuelink-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RescueLinkDb;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Cors__AllowedOrigins__0: "http://localhost:4200"
    ports:
      - "8080:8080"
    volumes:
      - rescuelink-uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  rescuelink-sql-data:
  rescuelink-uploads: