name: RescueLink CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore RescueLink.slnx

      - name: Build solution
        run: dotnet build RescueLink.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RescueLink.slnx --configuration Release --no-build --verbosity normal
