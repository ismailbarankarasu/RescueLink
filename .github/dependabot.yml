version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    reviewers:
      - ismailbarankarasu
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    reviewers:
      - ismailbarankarasu
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    reviewers:
      - ismailbarankarasu
    commit-message:
      prefix: deps
      include: scope
